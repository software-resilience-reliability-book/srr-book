# Docs are at: https://www.mkdocs.org/user-guide/configuration/

# Activate venv with: source .venv/bin/activate
# Preview with: mkdocs serve --livereload

# ##########################################
# Site
# ##########################################
site_name: "Software Resilience and Reliability"
site_url: "https://software-resilience-reliability-book.github.io/srr-book/"
site_author: "Mike Jovanovich"
repo_url: "https://github.com/software-resilience-reliability-book/srr-book"

# ##########################################
# Theme
# ##########################################
extra_css:
  - css/custom.css
theme:
  name: "material"
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # logo: "logo.png" # TODO: add logo?
  # favicon: "favicon.ico" # TODO: add favicon
  features:
    - content.code.copy # Show code copy button
    - navigation.instant # no page flash between chapters
    - navigation.footer # prev/next at bottom
    - navigation.indexes # section names link to index.md chapter intros
    - navigation.top # show back-to-top on long pages

# ##########################################
# Markdown Extensions
# ##########################################
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

