# Docs are at: https://www.mkdocs.org/user-guide/configuration/

# ##########################################
# Site
# ##########################################
site_name: "Software Resilience and Reliability"
# site_url: "" # TODO: GH Pages URL
site_author: "Mike Jovanovich"
# repo_name: "GitHub" # Not sure if I need this?
repo_url: "https://github.com/software-resilience-reliability-book/srr-book"
copyright: 'Copyright &copy; 2026 Mike Jovanovich. Licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>'

# ##########################################
# Theme
# ##########################################
theme:
  name: "material"
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # logo: "logo.png" # TODO: add logo?
  # favicon: "favicon.ico" # TODO: add favicon
  features:
    - navigation.instant # no page flash between chapters
    - navigation.footer # prev/next at bottom
    - navigation.indexes # section names link to index.md chapter intros
    - navigation.top # show back-to-top on long pages

# ##########################################
# Markdown Extensions
# ##########################################
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 0 # This will hide the intrapage TOC that normally appears on the right of the page.

# ##########################################
# Navigation
# ##########################################
nav:
  - Preface: index.md
  - Living Software:
      - living-software/index.md
      - living-software/another-page.md
  - Other Stuff:
      - other-stuff/index.md
